<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Souk Online - Marché Algérien</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(to bottom right, #fef3c7, #dbeafe);
            min-height: 100vh;
        }

        /* Header */
        header {
            background: linear-gradient(to right, #f97316, #fb923c, #fbbf24);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            position: sticky;
            top: 0;
            z-index: 40;
        }

        .header-content {
            max-width: 1280px;
            margin: 0 auto;
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1.5rem;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .header-logo {
            font-size: 2.5rem;
        }

        .header-text h1 {
            font-size: 2rem;
            font-weight: bold;
            color: white;
        }

        .header-text p {
            color: #fed7aa;
            font-size: 0.875rem;
        }

        .btn-post {
            background: white;
            color: #ea580c;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            font-weight: bold;
            border: none;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        .btn-post:hover {
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2);
            transform: scale(1.05);
            background: #f3f4f6;
        }

        /* Filters */
        .filters-section {
            background: white;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            position: sticky;
            top: 100px;
            z-index: 30;
        }

        .filters-content {
            max-width: 1280px;
            margin: 0 auto;
            padding: 1.5rem;
        }

        .filter-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .search-box {
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 0.5rem 1rem 0.5rem 2.5rem;
            border: 2px solid #e5e7eb;
            border-radius: 0.5rem;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        .search-box input:focus {
            outline: none;
            border-color: #fb923c;
        }

        .search-icon {
            position: absolute;
            left: 0.75rem;
            top: 0.75rem;
            color: #9ca3af;
        }

        select {
            width: 100%;
            padding: 0.5rem 1rem;
            border: 2px solid #e5e7eb;
            border-radius: 0.5rem;
            font-size: 1rem;
            cursor: pointer;
            transition: border-color 0.3s;
        }

        select:focus {
            outline: none;
            border-color: #fb923c;
        }

        input[type="number"] {
            padding: 0.5rem 1rem;
            border: 2px solid #e5e7eb;
            border-radius: 0.5rem;
            font-size: 1rem;
        }

        input[type="number"]:focus {
            outline: none;
            border-color: #fb923c;
        }

        .btn-reset {
            width: 100%;
            background: #ef4444;
            color: white;
            padding: 0.5rem;
            border: none;
            border-radius: 0.5rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn-reset:hover {
            background: #dc2626;
        }

        .count-text {
            color: #4b5563;
            font-size: 0.875rem;
            margin-top: 1rem;
        }

        /* Main Content */
        main {
            max-width: 1280px;
            margin: 0 auto;
            padding: 2rem 1rem;
        }

        .empty-state {
            text-align: center;
            padding: 4rem 1rem;
        }

        .empty-emoji {
            font-size: 3.5rem;
            margin-bottom: 1rem;
        }

        .empty-title {
            font-size: 1.5rem;
            font-weight: bold;
            color: #374151;
            margin-bottom: 0.5rem;
        }

        .empty-text {
            color: #6b7280;
            margin-bottom: 1.5rem;
        }

        .btn-primary {
            background: linear-gradient(to right, #f97316, #fbbf24);
            color: white;
            padding: 0.75rem 2rem;
            border: none;
            border-radius: 0.5rem;
            font-weight: bold;
            cursor: pointer;
            transition: box-shadow 0.3s;
        }

        .btn-primary:hover {
            box-shadow: 0 10px 15px rgba(0, 0, 0, 0.2);
        }

        /* Annonces Grid */
        .annonces-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        .annonce-card {
            background: white;
            border-radius: 0.75rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s;
        }

        .annonce-card:hover {
            box-shadow: 0 20px 25px rgba(0, 0, 0, 0.15);
            transform: scale(1.05);
        }

        .annonce-image {
            height: 200px;
            background: linear-gradient(135deg, #d1d5db, #f3f4f6);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            overflow: hidden;
        }

        .annonce-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s;
        }

        .annonce-card:hover .annonce-image img {
            transform: scale(1.1);
        }

        .annonce-content {
            padding: 1rem;
        }

        .annonce-title {
            font-weight: bold;
            font-size: 1.125rem;
            color: #1f2937;
            margin-bottom: 0.5rem;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .annonce-desc {
            color: #4b5563;
            font-size: 0.875rem;
            margin-bottom: 0.75rem;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .annonce-footer {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .annonce-price {
            font-size: 1.5rem;
            font-weight: bold;
            color: #ea580c;
        }

        .annonce-wilaya {
            color: #6b7280;
            font-size: 0.875rem;
            display: flex;
            align-items: center;
            gap: 0.25rem;
            margin-top: 0.25rem;
        }

        .annonce-badge {
            background: #fed7aa;
            color: #92400e;
            font-size: 0.75rem;
            font-weight: bold;
            padding: 0.375rem 0.75rem;
            border-radius: 9999px;
        }

        /* Modals */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 50;
            padding: 1rem;
        }

        .modal.hidden {
            display: none;
        }

        .modal-content {
            background: white;
            border-radius: 0.75rem;
            max-width: 600px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 1.5rem;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .modal-title {
            font-size: 1.5rem;
            font-weight: bold;
            color: #1f2937;
        }

        .btn-close {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: #9ca3af;
        }

        .btn-close:hover {
            color: #4b5563;
        }

        form {
            display: grid;
            gap: 1rem;
        }

        input[type="text"],
        input[type="tel"],
        textarea {
            width: 100%;
            padding: 0.5rem 1rem;
            border: 2px solid #e5e7eb;
            border-radius: 0.5rem;
            font-size: 1rem;
            font-family: inherit;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus,
        input[type="tel"]:focus,
        textarea:focus {
            outline: none;
            border-color: #fb923c;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .two-col {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .image-upload {
            border: 2px solid #e5e7eb;
            border-radius: 0.5rem;
            padding: 1.5rem;
            background: #f9fafb;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .image-upload:hover {
            border-color: #fb923c;
            background: #fef3c7;
        }

        .image-upload input[type="file"] {
            display: none;
        }

        .upload-label {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            cursor: pointer;
        }

        .image-preview {
            position: relative;
            margin-top: 1rem;
        }

        .image-preview img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 0.5rem;
        }

        .btn-remove-image {
            position: absolute;
            top: 0.5rem;
            right: 0.5rem;
            background: #ef4444;
            color: white;
            border: none;
            border-radius: 50%;
            width: 2rem;
            height: 2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            transition: background 0.3s;
        }

        .btn-remove-image:hover {
            background: #dc2626;
        }

        .form-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-top: 1rem;
        }

        .btn-submit {
            background: linear-gradient(to right, #f97316, #fbbf24);
            color: white;
            padding: 0.75rem;
            border: none;
            border-radius: 0.5rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-submit:hover {
            box-shadow: 0 10px 15px rgba(0, 0, 0, 0.2);
        }

        .btn-cancel {
            background: #d1d5db;
            color: #374151;
            padding: 0.75rem;
            border: none;
            border-radius: 0.5rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn-cancel:hover {
            background: #9ca3af;
        }

        /* Details Modal */
        .detail-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .detail-item h3 {
            color: #6b7280;
            font-size: 0.875rem;
            margin-bottom: 0.25rem;
        }

        .detail-item p {
            color: #1f2937;
            font-size: 1rem;
            font-weight: 600;
        }

        .price-display {
            font-size: 2rem;
            font-weight: bold;
            color: #ea580c;
        }

        .description-section {
            margin-bottom: 1.5rem;
        }

        .description-section h3 {
            color: #6b7280;
            font-size: 0.875rem;
            margin-bottom: 0.5rem;
        }

        .description-section p {
            color: #1f2937;
            line-height: 1.6;
        }

        .action-buttons {
            display: flex;
            gap: 0.75rem;
            margin-bottom: 1rem;
        }

        .btn-green {
            flex: 1;
            background: linear-gradient(to right, #16a34a, #10b981);
            color: white;
            padding: 0.75rem;
            border: none;
            border-radius: 0.5rem;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            transition: all 0.3s;
        }

        .btn-green:hover {
            box-shadow: 0 10px 15px rgba(0, 0, 0, 0.2);
        }

        .btn-blue {
            flex: 1;
            background: #3b82f6;
            color: white;
            padding: 0.75rem;
            border: none;
            border-radius: 0.5rem;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            transition: background 0.3s;
        }

        .btn-blue:hover {
            background: #1d4ed8;
        }

        .phone-display {
            background: #f3f4f6;
            padding: 1rem;
            border-radius: 0.5rem;
            margin-top: 1rem;
        }

        .phone-display p {
            color: #6b7280;
            font-size: 0.875rem;
            margin-bottom: 0.5rem;
        }

        .phone-display .phone-number {
            font-size: 1.5rem;
            font-weight: bold;
            color: #1f2937;
        }

        .btn-delete {
            width: 100%;
            background: #ef4444;
            color: white;
            padding: 0.5rem;
            border: none;
            border-radius: 0.5rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 1rem;
        }

        .btn-delete:hover {
            background: #dc2626;
        }

        /* Footer */
        footer {
            background: #111827;
            color: white;
            text-align: center;
            padding: 2rem 1rem;
            margin-top: 4rem;
        }

        footer p {
            margin-bottom: 0.5rem;
        }

        footer .footer-secondary {
            color: #9ca3af;
            font-size: 0.875rem;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header-content {
                flex-direction: column;
                gap: 0.5rem;
            }

            .header-text h1 {
                font-size: 1.5rem;
            }

            .filter-grid {
                grid-template-columns: 1fr;
            }

            .two-col {
                grid-template-columns: 1fr;
            }

            .annonces-grid {
                grid-template-columns: 1fr;
            }

            .form-buttons {
                grid-template-columns: 1fr;
            }

            .action-buttons {
                flex-direction: column;
            }

            .detail-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header>
        <div class="header-content">
            <div class="header-left">
                <div class="header-logo">🏪</div>
                <div class="header-text">
                    <h1>Souk Online</h1>
                    <p>Le marché algérien au bout de vos doigts</p>
                </div>
            </div>
            <button class="btn-post" onclick="openPostModal()">➕ Poster</button>
        </div>
    </header>

    <!-- Filters -->
    <div class="filters-section">
        <div class="filters-content">
            <div class="filter-grid">
                <div class="search-box">
                    <span class="search-icon">🔍</span>
                    <input type="text" id="searchInput" placeholder="Rechercher..." onkeyup="filterAnnonces()">
                </div>
                <select id="categorySelect" onchange="filterAnnonces()">
                    <option value="">Toutes catégories</option>
                </select>
                <select id="wilayaSelect" onchange="filterAnnonces()">
                    <option value="">Toutes wilayas</option>
                </select>
            </div>
            <div class="filter-grid" style="margin-top: 0.75rem;">
                <input type="number" id="minPrice" placeholder="Prix min (DA)" onchange="filterAnnonces()">
                <input type="number" id="maxPrice" placeholder="Prix max (DA)" onchange="filterAnnonces()">
                <button class="btn-reset" id="resetBtn" onclick="resetFilters()" style="display: none;">Réinitialiser</button>
            </div>
            <div class="count-text">
                <strong id="countAnnonces">0</strong> annonce(s)
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <main>
        <div id="mainContent"></div>
    </main>

    <!-- Modal Post -->
    <div class="modal" id="postModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">Poster une annonce</h2>
                <button class="btn-close" onclick="closePostModal()">✕</button>
            </div>
            <form id="postForm" onsubmit="postAnnonce(event)">
                <input type="text" id="titre" placeholder="Titre *" required>
                <textarea id="description" placeholder="Description *" required></textarea>
                
                <div class="two-col">
                    <select id="categorie" required></select>
                    <select id="wilaya" required></select>
                </div>

                <div class="two-col">
                    <input type="number" id="prix" placeholder="Prix (DA) *" required>
                    <input type="tel" id="telephone" placeholder="Téléphone *" required>
                </div>

                <div class="image-upload" onclick="document.getElementById('imageFile').click()">
                    <label class="upload-label">
                        <span>📷</span>
                        <span>Cliquez pour ajouter une image</span>
                    </label>
                    <input type="file" id="imageFile" accept="image/*" onchange="handleImageUpload(event)">
                </div>
                <div id="imagePreview"></div>

                <div class="form-buttons">
                    <button type="submit" class="btn-submit">Publier</button>
                    <button type="button" class="btn-cancel" onclick="closePostModal()">Annuler</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal Details -->
    <div class="modal" id="detailsModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title" id="detailsTitle"></h2>
                <button class="btn-close" onclick="closeDetailsModal()">✕</button>
            </div>
            <div id="detailsContent"></div>
        </div>
    </div>

    <footer>
        <p>© 2024 Souk Online - Le marché algérien au bout de vos doigts</p>
        <p class="footer-secondary">Développé pour les algériens 🇩🇿</p>
    </footer>

    <script>
        // Data
        const categories = [
            { id: 'electronique', name: '📱 Électronique' },
            { id: 'voitures', name: '🚗 Voitures' },
            { id: 'immobilier', name: '🏠 Immobilier' },
            { id: 'vetements', name: '👕 Vêtements & Mode' },
            { id: 'meubles', name: '🛋️ Meubles' },
            { id: 'livres', name: '📚 Livres & Éducation' },
            { id: 'sport', name: '🎮 Loisirs & Sports' },
            { id: 'beaute', name: '💄 Beauté & Cosmétiques' },
            { id: 'cuisine', name: '🍳 Cuisine & Électroménager' },
            { id: 'animaux', name: '🐾 Animaux' },
            { id: 'outils', name: '🔧 Outils & Matériel' },
            { id: 'emploi', name: '💼 Emploi & Services' }
        ];

        const wilayas = [
            'Adrar', 'Chlef', 'Laghouat', 'Oum El Bouaghi', 'Batna', 'Béjaïa', 'Biskra', 'Blida', 'Bouira',
            'Tamanrasset', 'Tébessa', 'Tlemcen', 'Tiaret', 'Tizi Ouzou', 'Alger', 'Djelfa', 'Jijel', 'Sétif',
            'Saïda', 'Skikda', 'Sidi Bel Abbès', 'Annaba', 'Guelma', 'Constantine', 'Médéa', 'Mostaganem',
            'M\'Sila', 'Mascara', 'Oran', 'El Bayadh', 'Illizi', 'Bordj Bou Arréridj', 'Ouargla', 'Icheriden',
            'El Oued', 'Khenchela', 'Souk Ahras', 'Tipasa', 'Mila', 'Aïn Défla', 'Naama', 'Aïn Témouchent',
            'Ghardaïa', 'Relizane', 'Draa Ben Khaidah', 'El Meghaïer', 'El Ménéa', 'Ouled Djellal'
        ];

        let annonces = [];
        let selectedImage = null;

        // Initialize
        function init() {
            loadAnnonces();
            populateSelects();
            displayAnnonces(annonces);
        }

        function populateSelects() {
            const categorySelect = document.getElementById('categorySelect');
            const categorieSelect = document.getElementById('categorie');
            const wilayaSelect = document.getElementById('wilaya');

            categorySelect.innerHTML = '<option value="">Toutes catégories</option>' +
                categories.map(c => `<option value="${c.id}">${c.name}</option>`).join('');

            categorieSelect.innerHTML = categories.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
            categorieSelect.value = 'electronique';

            wilayaSelect.innerHTML = wilayas.map(w => `<option value="${w}">${w}</option>`).join('');
            wilayaSelect.value = 'Alger';

            document.getElementById('wilayaSelect').innerHTML = '<option value="">Toutes wilayas</option>' +
                wilayas.map(w => `<option value="${w}">${w}</option>`).join('');
        }

        function loadAnnonces() {
            const saved = localStorage.getItem('soukOnlineAnnonces');
            annonces = saved ? JSON.parse(saved) : [];
        }

        function saveAnnonces() {
            localStorage.setItem('soukOnlineAnnonces', JSON.stringify(annonces));
        }

        function postAnnonce(e) {
            e.preventDefault();
            const newAnnonce = {
                id: Date.now(),
                titre: document.getElementById('titre').value,
                categorie: document.getElementById('categorie').value,
                description: document.getElementById('description').value,
                prix: parseInt(document.getElementById('prix').value),
                wilaya: document.getElementById('wilaya').value,
                telephone: document.getElementById('telephone').value,
                image: selectedImage,
                date: new Date().toLocaleDateString('fr-FR')
            };
            annonces.unshift(newAnnonce);
            saveAnnonces();
            document.getElementById('postForm').reset();
            selectedImage = null;
            document.getElementById('imagePreview').innerHTML = '';
            closePostModal();
            displayAnnonces(annonces);
        }

        function handleImageUpload(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    selectedImage = event.target.result;
                    const preview = document.getElementById('imagePreview');
                    preview.innerHTML = `
                        <div class="image-preview">
                            <img src="${selectedImage}" alt="Aperçu">
                            <button type="button" class="btn-remove-image" onclick="removeImage()">✕</button>
                        </div>
                    `;
                };
                reader.readAsDataURL(file);
            }
        }

        function removeImage() {
            selectedImage = null;
            document.getElementById('imageFile').value = '';
            document.getElementById('imagePreview').innerHTML = '';
        }

        function filterAnnonces() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const category = document.getElementById('categorySelect').value;
            const wilaya = document.getElementById('wilayaSelect').value;
            const minPrice = document.getElementById('minPrice').value ? parseInt(document.getElementById('minPrice').value) : 0;
            const maxPrice = document.getElementById('maxPrice').value ? parseInt(document.getElementById('maxPrice').value) : Infinity;

            const filtered = annonces.filter(a => {
                const matchSearch = a.titre.toLowerCase().includes(search) || a.description.toLowerCase().includes(search);
                const matchCategory = !category || a.categorie === category;
                const matchWilaya = !wilaya || a.wilaya === wilaya;
                const matchPrice = a.prix >= minPrice && a.prix <= maxPrice;
                return matchSearch && matchCategory && matchWilaya && matchPrice;
            });

            const hasFilters = search || category || wilaya || document.getElementById('minPrice').value || document.getElementById('maxPrice').value;
            document.getElementById('resetBtn').style.display = hasFilters ? 'block' : 'none';

            displayAnnonces(filtered);
        }

        function resetFilters() {
            document.getElementById('searchInput').value = '';
            document.getElementById('categorySelect').value = '';
            document.getElementById('wilayaSelect').value = '';
            document.getElementById('minPrice').value = '';
            document.getElementById('maxPrice').value = '';
            document.getElementById('resetBtn').style.display = 'none';
            displayAnnonces(annonces);
        }

        function displayAnnonces(list) {
            const mainContent = document.getElementById('mainContent');
            document.getElementById('countAnnonces').textContent = list.length;

            if (list.length === 0) {
                mainContent.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-emoji">🔍</div>
                        <h2 class="empty-title">Aucune annonce trouvée</h2>
                        <p class="empty-text">Essayez de modifier vos critères ou postez votre première annonce !</p>
                        <button class="btn-primary" onclick="openPostModal()">Poster une annonce</button>
                    </div>
                `;
                return;
            }

            mainContent.innerHTML = `<div class="annonces-grid">${
                list.map(a => `
                    <div class="annonce-card" onclick="showDetails(${a.id})">
                        <div class="annonce-image">
                            ${a.image ? `<img src="${a.image}" alt="${a.titre}">` : categories.find(c => c.id === a.categorie)?.name?.split(' ')[0] || '📦'}
                        </div>
                        <div class="annonce-content">
                            <h3 class="annonce-title">${a.titre}</h3>
                            <p class="annonce-desc">${a.description}</p>
                            <div class="annonce-footer">
                                <div>
                                    <div class="annonce-price">${a.prix} DA</div>
                                    <div class="annonce-wilaya">📍 ${a.wilaya}</div>
                                </div>
                                <span class="annonce-badge">${categories.find(c => c.id === a.categorie)?.name?.split(' ')[0]}</span>
                            </div>
                        </div>
                    </div>
                `).join('')
            }</div>`;
        }

        function showDetails(id) {
            const annonce = annonces.find(a => a.id === id);
            if (!annonce) return;

            document.getElementById('detailsTitle').textContent = annonce.titre;
            document.getElementById('detailsContent').innerHTML = `
                <div class="detail-grid">
                    <div class="detail-item">
                        <h3>Prix</h3>
                        <p class="price-display">${annonce.prix} DA</p>
                    </div>
                    <div class="detail-item">
                        <h3>Wilaya</h3>
                        <p>${annonce.wilaya}</p>
                    </div>
                    <div class="detail-item">
                        <h3>Catégorie</h3>
                        <p>${categories.find(c => c.id === annonce.categorie)?.name || annonce.categorie}</p>
                    </div>
                    <div class="detail-item">
                        <h3>Date</h3>
                        <p>${annonce.date}</p>
                    </div>
                </div>
                <div class="description-section">
                    <h3>Description</h3>
                    <p>${annonce.description}</p>
                </div>
                <div class="action-buttons">
                    <button class="btn-green" onclick="togglePhone(${id})">
                        <span id="phoneBtn-${id}">👁️ Voir numéro</span>
                    </button>
                </div>
                <div id="phoneSection-${id}" style="display: none;">
                    <div class="phone-display">
                        <p>Numéro de téléphone</p>
                        <div class="phone-number">${annonce.telephone}</div>
                    </div>
                    <button class="btn-blue" onclick="window.location.href = 'tel:${annonce.telephone}'">
                        📞 Appeler
                    </button>
                </div>
                <button class="btn-delete" onclick="deleteAnnonce(${id})">Supprimer</button>
            `;
            document.getElementById('detailsModal').classList.remove('hidden');
        }

        function togglePhone(id) {
            const section = document.getElementById(`phoneSection-${id}`);
            const btn = document.getElementById(`phoneBtn-${id}`);
            if (section.style.display === 'none') {
                section.style.display = 'block';
                btn.textContent = '👁️ Masquer numéro';
            } else {
                section.style.display = 'none';
                btn.textContent = '👁️ Voir numéro';
            }
        }

        function deleteAnnonce(id) {
            if (confirm('Êtes-vous sûr de vouloir supprimer cette annonce ?')) {
                annonces = annonces.filter(a => a.id !== id);
                saveAnnonces();
                closeDetailsModal();
                displayAnnonces(annonces);
            }
        }

        function openPostModal() {
            document.getElementById('postModal').classList.remove('hidden');
            selectedImage = null;
            document.getElementById('imagePreview').innerHTML = '';
        }

        function closePostModal() {
            document.getElementById('postModal').classList.add('hidden');
        }

        function closeDetailsModal() {
            document.getElementById('detailsModal').classList.add('hidden');
        }

        // Load on startup
        init();
    </script>
</body>
</html>
