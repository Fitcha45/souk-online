<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Souk Online - Marché Algérien</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(to bottom right, #fef3c7, #dbeafe);
            min-height: 100vh;
        }

        header {
            background: linear-gradient(to right, #f97316, #fb923c, #fbbf24);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 50;
        }

        .header-content {
            max-width: 1280px;
            margin: 0 auto;
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1.5rem;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .header-logo {
            font-size: 2rem;
        }

        .header-text h1 {
            font-size: 1.5rem;
            font-weight: bold;
            color: white;
        }

        .header-text p {
            color: #fed7aa;
            font-size: 0.75rem;
        }

        .btn-post {
            background: white;
            color: #ea580c;
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            font-weight: bold;
            border: none;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.875rem;
        }

        .btn-post:hover {
            transform: scale(1.05);
            background: #f3f4f6;
        }

        .filters-section {
            background: white;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            position: fixed;
            top: 70px;
            left: 0;
            right: 0;
            z-index: 40;
            max-height: 140px;
            overflow-y: auto;
        }

        .filters-content {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0.75rem;
        }

        .filter-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 0.5rem;
            margin-bottom: 0.5rem;
        }

        .search-box {
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 0.4rem 0.75rem 0.4rem 2rem;
            border: 2px solid #e5e7eb;
            border-radius: 0.5rem;
            font-size: 0.875rem;
        }

        .search-box input:focus {
            outline: none;
            border-color: #fb923c;
        }

        .search-icon {
            position: absolute;
            left: 0.5rem;
            top: 0.5rem;
            color: #9ca3af;
            font-size: 1rem;
        }

        select, input[type="number"] {
            width: 100%;
            padding: 0.4rem 0.75rem;
            border: 2px solid #e5e7eb;
            border-radius: 0.5rem;
            font-size: 0.875rem;
            cursor: pointer;
        }

        select:focus, input[type="number"]:focus {
            outline: none;
            border-color: #fb923c;
        }

        .btn-reset {
            width: 100%;
            background: #ef4444;
            color: white;
            padding: 0.4rem;
            border: none;
            border-radius: 0.5rem;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.875rem;
        }

        .btn-reset:hover {
            background: #dc2626;
        }

        .count-text {
            color: #4b5563;
            font-size: 0.75rem;
        }

        main {
            max-width: 1280px;
            margin: 0 auto;
            padding: 230px 1rem 2rem 1rem;
        }

        .empty-state {
            text-align: center;
            padding: 2rem 1rem;
        }

        .empty-emoji {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        .empty-title {
            font-size: 1.25rem;
            font-weight: bold;
            color: #374151;
            margin-bottom: 0.5rem;
        }

        .empty-text {
            color: #6b7280;
            margin-bottom: 1rem;
        }

        .btn-primary {
            background: linear-gradient(to right, #f97316, #fbbf24);
            color: white;
            padding: 0.5rem 1.5rem;
            border: none;
            border-radius: 0.5rem;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.875rem;
        }

        .btn-primary:hover {
            box-shadow: 0 10px 15px rgba(0, 0, 0, 0.2);
        }

        .annonces-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1rem;
        }

        .annonce-card {
            background: white;
            border-radius: 0.75rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s;
        }

        .annonce-card:hover {
            box-shadow: 0 20px 25px rgba(0, 0, 0, 0.15);
            transform: scale(1.02);
        }

        .annonce-image-container {
            height: 180px;
            background: linear-gradient(135deg, #d1d5db, #f3f4f6);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            overflow: hidden;
            position: relative;
        }

        .annonce-image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .image-counter {
            position: absolute;
            bottom: 5px;
            right: 5px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 0.75rem;
            font-weight: bold;
        }

        .badge-vendu {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 0.4rem 0.8rem;
            border-radius: 0.3rem;
            font-weight: bold;
            font-size: 0.85rem;
        }

        .annonce-image-container.vendu {
            opacity: 0.6;
        }

        .annonce-card.vendu {
            opacity: 0.7;
        }

        .annonce-card.vendu .annonce-title {
            text-decoration: line-through;
            color: #9ca3af;
        }

        .annonce-content {
            padding: 0.75rem;
        }

        .annonce-title {
            font-weight: bold;
            font-size: 1rem;
            color: #1f2937;
            margin-bottom: 0.3rem;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .annonce-desc {
            color: #4b5563;
            font-size: 0.8rem;
            margin-bottom: 0.5rem;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .annonce-footer {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .annonce-price {
            font-size: 1.25rem;
            font-weight: bold;
            color: #ea580c;
        }

        .annonce-wilaya {
            color: #6b7280;
            font-size: 0.75rem;
            margin-top: 0.2rem;
        }

        .annonce-badge {
            background: #fed7aa;
            color: #92400e;
            font-size: 0.65rem;
            font-weight: bold;
            padding: 0.25rem 0.5rem;
            border-radius: 9999px;
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 60;
            padding: 1rem;
        }

        .modal.hidden {
            display: none;
        }

        .modal-content {
            background: white;
            border-radius: 0.75rem;
            max-width: 500px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 1.25rem;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .modal-title {
            font-size: 1.25rem;
            font-weight: bold;
            color: #1f2937;
        }

        .btn-close {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: #9ca3af;
        }

        .btn-close:hover {
            color: #4b5563;
        }

        form {
            display: grid;
            gap: 0.75rem;
        }

        input[type="text"], input[type="tel"], textarea, select {
            width: 100%;
            padding: 0.5rem;
            border: 2px solid #e5e7eb;
            border-radius: 0.5rem;
            font-size: 0.9rem;
            font-family: inherit;
        }

        input[type="text"]:focus, input[type="tel"]:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #fb923c;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .two-col {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.5rem;
        }

        .image-upload {
            border: 2px solid #e5e7eb;
            border-radius: 0.5rem;
            padding: 1rem;
            background: #f9fafb;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .image-upload:hover {
            border-color: #fb923c;
            background: #fef3c7;
        }

        .image-upload input[type="file"] {
            display: none;
        }

        .upload-label {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .images-preview {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
            gap: 0.5rem;
            margin-top: 0.75rem;
        }

        .image-preview-item {
            position: relative;
            width: 100%;
            aspect-ratio: 1;
        }

        .image-preview-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 0.3rem;
        }

        .btn-remove-image {
            position: absolute;
            top: -8px;
            right: -8px;
            background: #ef4444;
            color: white;
            border: none;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            cursor: pointer;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-remove-image:hover {
            background: #dc2626;
        }

        .form-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.5rem;
            margin-top: 0.75rem;
        }

        .btn-submit {
            background: linear-gradient(to right, #f97316, #fbbf24);
            color: white;
            padding: 0.5rem;
            border: none;
            border-radius: 0.5rem;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .btn-submit:hover {
            box-shadow: 0 10px 15px rgba(0, 0, 0, 0.2);
        }

        .btn-cancel {
            background: #d1d5db;
            color: #374151;
            padding: 0.5rem;
            border: none;
            border-radius: 0.5rem;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .btn-cancel:hover {
            background: #9ca3af;
        }

        .gallery-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 70;
            padding: 1rem;
        }

        .gallery-modal.hidden {
            display: none;
        }

        .gallery-content {
            position: relative;
            max-width: 90vw;
            max-height: 90vh;
        }

        .gallery-image {
            max-width: 100%;
            max-height: 80vh;
            object-fit: contain;
        }

        .gallery-close {
            position: absolute;
            top: 10px;
            right: 10px;
            background: white;
            color: black;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            font-size: 1.5rem;
            cursor: pointer;
            z-index: 71;
        }

        .gallery-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255,255,255,0.3);
            color: white;
            border: none;
            width: 50px;
            height: 50px;
            cursor: pointer;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 0.3rem;
        }

        .gallery-nav:hover {
            background: rgba(255,255,255,0.5);
        }

        .gallery-prev {
            left: 10px;
        }

        .gallery-next {
            right: 10px;
        }

        .gallery-counter {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 0.3rem;
            font-size: 0.9rem;
        }

        .detail-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
            margin-bottom: 1rem;
        }

        .detail-item h3 {
            color: #6b7280;
            font-size: 0.75rem;
            margin-bottom: 0.2rem;
        }

        .detail-item p {
            color: #1f2937;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .price-display {
            font-size: 1.5rem;
            font-weight: bold;
            color: #ea580c;
        }

        .description-section {
            margin-bottom: 1rem;
        }

        .description-section h3 {
            color: #6b7280;
            font-size: 0.75rem;
            margin-bottom: 0.3rem;
        }

        .description-section p {
            color: #1f2937;
            line-height: 1.5;
            font-size: 0.9rem;
        }

        .action-buttons {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 0.75rem;
            flex-wrap: wrap;
        }

        .btn-green {
            flex: 1;
            background: linear-gradient(to right, #16a34a, #10b981);
            color: white;
            padding: 0.5rem;
            border: none;
            border-radius: 0.5rem;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .btn-green:hover {
            box-shadow: 0 10px 15px rgba(0, 0, 0, 0.2);
        }

        .btn-blue {
            flex: 1;
            background: #3b82f6;
            color: white;
            padding: 0.5rem;
            border: none;
            border-radius: 0.5rem;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .btn-blue:hover {
            background: #1d4ed8;
        }

        .phone-display {
            background: #f3f4f6;
            padding: 0.75rem;
            border-radius: 0.5rem;
            margin-top: 0.75rem;
        }

        .phone-display p {
            color: #6b7280;
            font-size: 0.8rem;
            margin-bottom: 0.3rem;
        }

        .phone-display .phone-number {
            font-size: 1.25rem;
            font-weight: bold;
            color: #1f2937;
        }

        .btn-delete {
            width: 100%;
            background: #ef4444;
            color: white;
            padding: 0.5rem;
            border: none;
            border-radius: 0.5rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 0.75rem;
            font-size: 0.85rem;
        }

        .btn-delete:hover {
            background: #dc2626;
        }

        footer {
            background: #111827;
            color: white;
            text-align: center;
            padding: 1.5rem 1rem;
            margin-top: 2rem;
        }

        footer p {
            margin-bottom: 0.3rem;
            font-size: 0.9rem;
        }

        footer .footer-secondary {
            color: #9ca3af;
            font-size: 0.8rem;
        }

        @media (max-width: 640px) {
            .filter-grid {
                grid-template-columns: 1fr;
            }

            main {
                padding: 200px 0.5rem 1.5rem 0.5rem;
            }

            .annonces-grid {
                grid-template-columns: 1fr;
            }

            .two-col {
                grid-template-columns: 1fr;
            }

            .detail-grid {
                grid-template-columns: 1fr;
            }

            .form-buttons {
                grid-template-columns: 1fr;
            }

            .action-buttons {
                flex-direction: column;
            }

            .header-text h1 {
                font-size: 1.1rem;
            }

            .header-text p {
                font-size: 0.65rem;
            }

            .btn-post {
                padding: 0.4rem 0.8rem;
                font-size: 0.75rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-content">
            <div class="header-left">
                <div class="header-logo">🏪</div>
                <div class="header-text">
                    <h1>Souk Online</h1>
                    <p>Marché algérien</p>
                </div>
            </div>
            <button class="btn-post" onclick="openPostModal()">➕ Poster</button>
        </div>
    </header>

    <div class="filters-section">
        <div class="filters-content">
            <div class="filter-grid">
                <div class="search-box">
                    <span class="search-icon">🔍</span>
                    <input type="text" id="searchInput" placeholder="Rechercher..." onkeyup="filterAnnonces()">
                </div>
                <select id="categorySelect" onchange="filterAnnonces()">
                    <option value="">Toutes catégories</option>
                </select>
                <select id="wilayaSelect" onchange="filterAnnonces()">
                    <option value="">Toutes wilayas</option>
                </select>
                <input type="number" id="minPrice" placeholder="Prix min (DA)" onchange="filterAnnonces()">
                <input type="number" id="maxPrice" placeholder="Prix max (DA)" onchange="filterAnnonces()">
                <button class="btn-reset" id="resetBtn" onclick="resetFilters()" style="display: none;">Réinitialiser</button>
            </div>
            <div class="count-text">
                <strong id="countAnnonces">0</strong> annonce(s)
            </div>
        </div>
    </div>

    <main>
        <div id="mainContent"></div>
    </main>

    <div class="modal" id="postModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">Poster une annonce</h2>
                <button class="btn-close" onclick="closePostModal()">✕</button>
            </div>
            <form id="postForm" onsubmit="postAnnonce(event)">
                <input type="text" id="titre" placeholder="Titre *" required>
                <textarea id="description" placeholder="Description *" required></textarea>
                
                <div class="two-col">
                    <select id="categorie" required></select>
                    <select id="wilaya" required></select>
                </div>

                <div class="two-col">
                    <input type="number" id="prix" placeholder="Prix (DA) *" required>
                    <input type="tel" id="telephone" placeholder="Téléphone *" required>
                </div>

                <div class="image-upload" onclick="document.getElementById('imageFiles').click()">
                    <label class="upload-label">
                        <span>📷</span>
                        <span>Cliquez pour ajouter des images</span>
                    </label>
                    <input type="file" id="imageFiles" accept="image/*" multiple onchange="handleImagesUpload(event)">
                </div>
                <div id="imagesPreview" class="images-preview"></div>

                <div class="form-buttons">
                    <button type="submit" class="btn-submit">Publier</button>
                    <button type="button" class="btn-cancel" onclick="closePostModal()">Annuler</button>
                </div>
            </form>
        </div>
    </div>

    <div class="modal" id="detailsModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title" id="detailsTitle"></h2>
                <button class="btn-close" onclick="closeDetailsModal()">✕</button>
            </div>
            <div id="detailsContent"></div>
        </div>
    </div>

    <div class="gallery-modal" id="galleryModal">
        <button class="gallery-close" onclick="closeGallery()">✕</button>
        <div class="gallery-content">
            <button class="gallery-nav gallery-prev" onclick="prevImage()">❮</button>
            <img id="galleryImage" class="gallery-image" alt="Image">
            <button class="gallery-nav gallery-next" onclick="nextImage()">❯</button>
            <div class="gallery-counter">
                <span id="imageNum">1</span> / <span id="totalImages">1</span>
            </div>
        </div>
    </div>

    <footer>
        <p>© 2026 Souk Online - Le marché algérien au bout de vos doigts</p>
        <p class="footer-secondary">Développé pour les algériens 🇩🇿</p>
    </footer>

    <script>
        const categories = [
            { id: 'electronique', name: '📱 Électronique' },
            { id: 'voitures', name: '🚗 Voitures' },
            { id: 'immobilier', name: '🏠 Immobilier' },
            { id: 'vetements', name: '👕 Vêtements & Mode' },
            { id: 'meubles', name: '🛋️ Meubles' },
            { id: 'livres', name: '📚 Livres & Éducation' },
            { id: 'sport', name: '🎮 Loisirs & Sports' },
            { id: 'beaute', name: '💄 Beauté & Cosmétiques' },
            { id: 'cuisine', name: '🍳 Cuisine & Électroménager' },
            { id: 'animaux', name: '🐾 Animaux' },
            { id: 'outils', name: '🔧 Outils & Matériel' },
            { id: 'emploi', name: '💼 Emploi & Services' }
        ];

        const wilayas = [
            'Adrar', 'Chlef', 'Laghouat', 'Oum El Bouaghi', 'Batna', 'Béjaïa', 'Biskra', 'Blida', 'Bouira',
            'Tamanrasset', 'Tébessa', 'Tlemcen', 'Tiaret', 'Tizi Ouzou', 'Alger', 'Djelfa', 'Jijel', 'Sétif',
            'Saïda', 'Skikda', 'Sidi Bel Abbès', 'Annaba', 'Guelma', 'Constantine', 'Médéa', 'Mostaganem',
            'M\'Sila', 'Mascara', 'Oran', 'El Bayadh', 'Illizi', 'Bordj Bou Arréridj', 'Ouargla', 'Icheriden',
            'El Oued', 'Khenchela', 'Souk Ahras', 'Tipasa', 'Mila', 'Aïn Défla', 'Naama', 'Aïn Témouchent',
            'Ghardaïa', 'Relizane', 'Draa Ben Khaidah', 'El Meghaïer', 'El Ménéa', 'Ouled Djellal'
        ];

        let annonces = [];
        let selectedImages = [];
        let currentGalleryImages = [];
        let currentImageIndex = 0;

        function init() {
            loadAnnonces();
            populateSelects();
            displayAnnonces(annonces);
        }

        function populateSelects() {
            const categorySelect = document.getElementById('categorySelect');
            const categorieSelect = document.getElementById('categorie');
            const wilayaSelect = document.getElementById('wilaya');

            categorySelect.innerHTML = '<option value="">Toutes catégories</option>' +
                categories.map(c => `<option value="${c.id}">${c.name}</option>`).join('');

            categorieSelect.innerHTML = categories.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
            categorieSelect.value = 'electronique';

            wilayaSelect.innerHTML = wilayas.map(w => `<option value="${w}">${w}</option>`).join('');
            wilayaSelect.value = 'Alger';

            document.getElementById('wilayaSelect').innerHTML = '<option value="">Toutes wilayas</option>' +
                wilayas.map(w => `<option value="${w}">${w}</option>`).join('');
        }

        function loadAnnonces() {
            const saved = localStorage.getItem('soukOnlineAnnonces');
            annonces = saved ? JSON.parse(saved) : [];
        }

        function saveAnnonces() {
            localStorage.setItem('soukOnlineAnnonces', JSON.stringify(annonces));
        }

        function postAnnonce(e) {
            e.preventDefault();
            const newAnnonce = {
                id: Date.now(),
                titre: document.getElementById('titre').value,
                categorie: document.getElementById('categorie').value,
                description: document.getElementById('description').value,
                prix: parseInt(document.getElementById('prix').value),
                wilaya: document.getElementById('wilaya').value,
                telephone: document.getElementById('telephone').value,
                images: selectedImages,
                date: new Date().toLocaleDateString('fr-FR'),
                vendu: false
            };
            annonces.unshift(newAnnonce);
            saveAnnonces();
            document.getElementById('postForm').reset();
            selectedImages = [];
            document.getElementById('imagesPreview').innerHTML = '';
            closePostModal();
            displayAnnonces(annonces);
        }

        function handleImagesUpload(e) {
            const files = e.target.files;
            selectedImages = [];
            const preview = document.getElementById('imagesPreview');
            preview.innerHTML = '';

            Array.from(files).forEach((file, index) => {
                const reader = new FileReader();
                reader.onload = (event) => {
                    selectedImages.push(event.target.result);
                    const div = document.createElement('div');
                    div.className = 'image-preview-item';
                    div.innerHTML = `
                        <img src="${event.target.result}" alt="Image ${index + 1}">
                        <button type="button" class="btn-remove-image" onclick="removeImagePreview(${index})">✕</button>
                    `;
                    preview.appendChild(div);
                };
                reader.readAsDataURL(file);
            });
        }

        function removeImagePreview(index) {
            selectedImages.splice(index, 1);
            const preview = document.getElementById('imagesPreview');
            preview.innerHTML = '';
            selectedImages.forEach((img, i) => {
                const div = document.createElement('div');
                div.className = 'image-preview-item';
                div.innerHTML = `
                    <img src="${img}" alt="Image ${i + 1}">
                    <button type="button" class="btn-remove-image" onclick="removeImagePreview(${i})">✕</button>
                `;
                preview.appendChild(div);
            });
        }

        function filterAnnonces() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const category = document.getElementById('categorySelect').value;
            const wilaya = document.getElementById('wilayaSelect').value;
            const minPrice = document.getElementById('minPrice').value ? parseInt(document.getElementById('minPrice').value) : 0;
            const maxPrice = document.getElementById('maxPrice').value ? parseInt(document.getElementById('maxPrice').value) : Infinity;

            const filtered = annonces.filter(a => {
                const matchSearch = a.titre.toLowerCase().includes(search) || a.description.toLowerCase().includes(search);
                const matchCategory = !category || a.categorie === category;
                const matchWilaya = !wilaya || a.wilaya === wilaya;
                const matchPrice = a.prix >= minPrice && a.prix <= maxPrice;
                return matchSearch && matchCategory && matchWilaya && matchPrice;
            });

            const hasFilters = search || category || wilaya || document.getElementById('minPrice').value || document.getElementById('maxPrice').value;
            document.getElementById('resetBtn').style.display = hasFilters ? 'block' : 'none';

            displayAnnonces(filtered);
        }

        function resetFilters() {
            document.getElementById('searchInput').value = '';
            document.getElementById('categorySelect').value = '';
            document.getElementById('wilayaSelect').value = '';
            document.getElementById('minPrice').value = '';
            document.getElementById('maxPrice').value = '';
            document.getElementById('resetBtn').style.display = 'none';
            displayAnnonces(annonces);
        }

        function displayAnnonces(list) {
            const mainContent = document.getElementById('mainContent');
            document.getElementById('countAnnonces').textContent = list.length;

            if (list.length === 0) {
                mainContent.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-emoji">🔍</div>
                        <h2 class="empty-title">Aucune annonce trouvée</h2>
                        <p class="empty-text">Essayez de modifier vos critères ou postez votre première annonce !</p>
                        <button class="btn-primary" onclick="openPostModal()">Poster une annonce</button>
                    </div>
                `;
                return;
            }

            mainContent.innerHTML = `<div class="annonces-grid">${
                list.map(a => `
                    <div class="annonce-card ${a.vendu ? 'vendu' : ''}" onclick="showDetails(${a.id})">
                        <div class="annonce-image-container ${a.vendu ? 'vendu' : ''}" onclick="openGallery(${a.id}, event)">
                            ${a.vendu ? '<div class="badge-vendu">✓ VENDU</div>' : ''}
                            ${a.images && a.images.length > 0 ? `
                                <img src="${a.images[0]}" alt="${a.titre}">
                                ${a.images.length > 1 ? `<div class="image-counter">${a.images.length} images</div>` : ''}
                            ` : categories.find(c => c.id === a.categorie)?.name?.split(' ')[0] || '📦'}
                        </div>
                        <div class="annonce-content">
                            <h3 class="annonce-title">${a.titre}</h3>
                            <p class="annonce-desc">${a.description}</p>
                            <div class="annonce-footer">
                                <div>
                                    <div class="annonce-price">${a.prix} DA</div>
                                    <div class="annonce-wilaya">📍 ${a.wilaya}</div>
                                </div>
                                <span class="annonce-badge">${categories.find(c => c.id === a.categorie)?.name?.split(' ')[0]}</span>
                            </div>
                        </div>
                    </div>
                `).join('')
            }</div>`;
        }

        function openGallery(id, event) {
            event.stopPropagation();
            const annonce = annonces.find(a => a.id === id);
            if (!annonce || !annonce.images || annonce.images.length === 0) return;
            
            currentGalleryImages = annonce.images;
            currentImageIndex = 0;
            updateGallery();
            document.getElementById('galleryModal').classList.remove('hidden');
        }

        function closeGallery() {
            document.getElementById('galleryModal').classList.add('hidden');
        }

        function updateGallery() {
            document.getElementById('galleryImage').src = currentGalleryImages[currentImageIndex];
            document.getElementById('imageNum').textContent = currentImageIndex + 1;
            document.getElementById('totalImages').textContent = currentGalleryImages.length;
        }

        function nextImage() {
            currentImageIndex = (currentImageIndex + 1) % currentGalleryImages.length;
            updateGallery();
        }

        function prevImage() {
            currentImageIndex = (currentImageIndex - 1 + currentGalleryImages.length) % currentGalleryImages.length;
            updateGallery();
        }

        function showDetails(id) {
            const annonce = annonces.find(a => a.id === id);
            if (!annonce) return;

            let imagesHtml = '';
            if (annonce.images && annonce.images.length > 0) {
                imagesHtml = `
                    <div style="margin-bottom: 1rem;">
                        <h3 style="color: #6b7280; font-size: 0.75rem; margin-bottom: 0.3rem;">Images (${annonce.images.length})</h3>
                        <div class="images-preview">
                            ${annonce.images.map((img, i) => `
                                <div class="image-preview-item" onclick="openGallery(${id}, event)" style="cursor: pointer;">
                                    <img src="${img}" alt="Image ${i + 1}">
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }

            document.getElementById('detailsTitle').textContent = annonce.titre;
            document.getElementById('detailsContent').innerHTML = `
                ${imagesHtml}
                <div class="detail-grid">
                    <div class="detail-item">
                        <h3>Prix</h3>
                        <p class="price-display">${annonce.prix} DA</p>
                    </div>
                    <div class="detail-item">
                        <h3>Wilaya</h3>
                        <p>${annonce.wilaya}</p>
                    </div>
                    <div class="detail-item">
                        <h3>Catégorie</h3>
                        <p>${categories.find(c => c.id === annonce.categorie)?.name || annonce.categorie}</p>
                    </div>
                    <div class="detail-item">
                        <h3>Date</h3>
                        <p>${annonce.date}</p>
                    </div>
                </div>
                <div class="description-section">
                    <h3>Description</h3>
                    <p>${annonce.description}</p>
                </div>
                <div class="action-buttons">
                    <button class="btn-green" onclick="togglePhone(${id})">
                        <span id="phoneBtn-${id}">👁️ Voir numéro</span>
                    </button>
                    <button class="btn-blue" onclick="toggleVendu(${id})">
                        <span id="venduBtn-${id}">${annonce.vendu ? '↩️ Marquer disponible' : '✓ Marquer vendu'}</span>
                    </button>
                </div>
                <div id="phoneSection-${id}" style="display: none;">
                    <div class="phone-display">
                        <p>Numéro de téléphone</p>
                        <div class="phone-number">${annonce.telephone}</div>
                    </div>
                    <button class="btn-blue" onclick="window.location.href = 'tel:${annonce.telephone}'">
                        📞 Appeler
                    </button>
                </div>
                <button class="btn-delete" onclick="deleteAnnonce(${id})">Supprimer</button>
            `;
            document.getElementById('detailsModal').classList.remove('hidden');
        }

        function togglePhone(id) {
            const section = document.getElementById(`phoneSection-${id}`);
            const btn = document.getElementById(`phoneBtn-${id}`);
            if (section.style.display === 'none') {
                section.style.display = 'block';
                btn.textContent = '👁️ Masquer numéro';
            } else {
                section.style.display = 'none';
                btn.textContent = '👁️ Voir numéro';
            }
        }

        function toggleVendu(id) {
            const annonce = annonces.find(a => a.id === id);
            if (annonce) {
                annonce.vendu = !annonce.vendu;
                saveAnnonces();
                showDetails(id);
                displayAnnonces(annonces);
            }
        }

        function deleteAnnonce(id) {
            if (confirm('Êtes-vous sûr de vouloir supprimer cette annonce ?')) {
                annonces = annonces.filter(a => a.id !== id);
                saveAnnonces();
                closeDetailsModal();
                displayAnnonces(annonces);
            }
        }

        function openPostModal() {
            document.getElementById('postModal').classList.remove('hidden');
            selectedImages = [];
            document.getElementById('imagesPreview').innerHTML = '';
        }

        function closePostModal() {
            document.getElementById('postModal').classList.add('hidden');
        }

        function closeDetailsModal() {
            document.getElementById('detailsModal').classList.add('hidden');
        }

        init();
    </script>
</body>
</html>
