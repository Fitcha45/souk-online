<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Souk Online - Marché Algérien</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(to bottom right, #fef3c7, #dbeafe); min-height: 100vh; }
        header { background: linear-gradient(to right, #f97316, #fb923c, #fbbf24); box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1); position: fixed; top: 0; left: 0; right: 0; z-index: 50; }
        .header-content { max-width: 1280px; margin: 0 auto; padding: 1rem; display: flex; justify-content: space-between; align-items: center; }
        .header-left { display: flex; align-items: center; gap: 1rem; }
        .header-logo { font-size: 2rem; }
        .header-text h1 { font-size: 1.5rem; color: white; margin: 0; }
        .header-text p { color: #fed7aa; font-size: 0.75rem; margin: 0; }
        .btn-post { background: white; color: #ea580c; padding: 0.5rem 1rem; border-radius: 0.5rem; font-weight: bold; border: none; cursor: pointer; font-size: 0.875rem; }
        .filters-section { background: white; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); position: fixed; top: 70px; left: 0; right: 0; z-index: 40; max-height: 140px; overflow-y: auto; }
        .filters-content { max-width: 1280px; margin: 0 auto; padding: 0.75rem; }
        .filter-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 0.5rem; margin-bottom: 0.5rem; }
        .search-box { position: relative; }
        .search-box input { width: 100%; padding: 0.4rem 0.75rem 0.4rem 2rem; border: 2px solid #e5e7eb; border-radius: 0.5rem; font-size: 0.875rem; }
        .search-icon { position: absolute; left: 0.5rem; top: 0.5rem; }
        select, input[type="number"] { width: 100%; padding: 0.4rem 0.75rem; border: 2px solid #e5e7eb; border-radius: 0.5rem; font-size: 0.875rem; }
        main { max-width: 1280px; margin: 0 auto; padding: 230px 1rem 2rem; }
        .annonces-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1rem; }
        .annonce-card { background: white; border-radius: 0.75rem; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); overflow: hidden; cursor: pointer; transition: all 0.3s; }
        .annonce-card:hover { box-shadow: 0 20px 25px rgba(0, 0, 0, 0.15); transform: scale(1.02); }
        .annonce-card.vendu { opacity: 0.7; }
        .annonce-image-container { height: 180px; background: #f3f4f6; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; }
        .annonce-image-container img { width: 100%; height: 100%; object-fit: cover; }
        .badge-vendu { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.8); color: white; padding: 0.4rem 0.8rem; border-radius: 0.3rem; font-weight: bold; font-size: 0.85rem; }
        .image-counter { position: absolute; bottom: 5px; right: 5px; background: rgba(0,0,0,0.7); color: white; padding: 2px 6px; border-radius: 3px; font-size: 0.75rem; }
        .annonce-content { padding: 0.75rem; }
        .annonce-title { font-weight: bold; font-size: 1rem; color: #1f2937; margin-bottom: 0.3rem; }
        .annonce-desc { color: #4b5563; font-size: 0.8rem; margin-bottom: 0.5rem; }
        .annonce-footer { display: flex; justify-content: space-between; align-items: flex-end; }
        .annonce-price { font-size: 1.25rem; font-weight: bold; color: #ea580c; }
        .annonce-wilaya { color: #6b7280; font-size: 0.75rem; margin-top: 0.2rem; }
        .modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.5); display: flex; align-items: center; justify-content: center; z-index: 60; padding: 1rem; }
        .modal.hidden { display: none; }
        .modal-content { background: white; border-radius: 0.75rem; max-width: 500px; width: 100%; max-height: 90vh; overflow-y: auto; padding: 1.25rem; }
        .modal-header { display: flex; justify-content: space-between; margin-bottom: 1rem; }
        .modal-title { font-size: 1.25rem; font-weight: bold; }
        .btn-close { background: none; border: none; font-size: 1.5rem; cursor: pointer; color: #9ca3af; }
        form { display: grid; gap: 0.75rem; }
        input[type="text"], input[type="tel"], textarea, select { width: 100%; padding: 0.5rem; border: 2px solid #e5e7eb; border-radius: 0.5rem; font-size: 0.9rem; }
        textarea { min-height: 80px; }
        .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; }
        .image-upload { border: 2px solid #e5e7eb; border-radius: 0.5rem; padding: 1rem; background: #f9fafb; text-align: center; cursor: pointer; }
        .image-upload input { display: none; }
        .images-preview { display: grid; grid-template-columns: repeat(auto-fit, minmax(80px, 1fr)); gap: 0.5rem; margin-top: 0.75rem; }
        .image-preview-item { position: relative; width: 100%; }
        .image-preview-item img { width: 100%; height: 80px; object-fit: cover; border-radius: 0.3rem; }
        .btn-remove-image { position: absolute; top: -8px; right: -8px; background: #ef4444; color: white; border: none; border-radius: 50%; width: 24px; height: 24px; cursor: pointer; font-size: 0.8rem; }
        .form-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; margin-top: 0.75rem; }
        .btn-submit { background: linear-gradient(to right, #f97316, #fbbf24); color: white; padding: 0.5rem; border: none; border-radius: 0.5rem; font-weight: bold; cursor: pointer; }
        .btn-cancel { background: #d1d5db; color: #374151; padding: 0.5rem; border: none; border-radius: 0.5rem; cursor: pointer; }
        .btn-green { flex: 1; background: #16a34a; color: white; padding: 0.5rem; border: none; border-radius: 0.5rem; cursor: pointer; font-size: 0.85rem; }
        .btn-blue { flex: 1; background: #3b82f6; color: white; padding: 0.5rem; border: none; border-radius: 0.5rem; cursor: pointer; font-size: 0.85rem; }
        .action-buttons { display: flex; gap: 0.5rem; margin-bottom: 0.75rem; flex-wrap: wrap; }
        .phone-display { background: #f3f4f6; padding: 0.75rem; border-radius: 0.5rem; margin-top: 0.75rem; }
        .btn-delete { width: 100%; background: #ef4444; color: white; padding: 0.5rem; border: none; border-radius: 0.5rem; cursor: pointer; margin-top: 0.75rem; }
        footer { background: #111827; color: white; text-align: center; padding: 1.5rem 1rem; margin-top: 2rem; }
        .empty-state { text-align: center; padding: 2rem; }
    </style>
</head>
<body>
    <header>
        <div class="header-content">
            <div class="header-left">
                <div class="header-logo">🏪</div>
                <div class="header-text">
                    <h1>Souk Online</h1>
                    <p>Marché algérien</p>
                </div>
            </div>
            <button class="btn-post" onclick="openPostModal()">➕ Poster</button>
        </div>
    </header>

    <div class="filters-section">
        <div class="filters-content">
            <div class="filter-grid">
                <div class="search-box">
                    <span class="search-icon">🔍</span>
                    <input type="text" id="searchInput" placeholder="Rechercher..." onkeyup="filterAnnonces()">
                </div>
                <select id="categorySelect" onchange="filterAnnonces()"><option value="">Toutes</option></select>
                <select id="wilayaSelect" onchange="filterAnnonces()"><option value="">Toutes</option></select>
                <input type="number" id="minPrice" placeholder="Min" onchange="filterAnnonces()">
                <input type="number" id="maxPrice" placeholder="Max" onchange="filterAnnonces()">
            </div>
            <div style="color: #4b5563; font-size: 0.75rem;">
                <strong id="countAnnonces">0</strong> annonce(s)
            </div>
        </div>
    </div>

    <main><div id="mainContent"></div></main>

    <div class="modal" id="postModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">Poster une annonce</h2>
                <button class="btn-close" onclick="closePostModal()">✕</button>
            </div>
            <form id="postForm" onsubmit="postAnnonce(event)">
                <input type="text" id="titre" placeholder="Titre *" required>
                <textarea id="description" placeholder="Description *" required></textarea>
                <div class="two-col">
                    <select id="categorie" required></select>
                    <select id="wilaya" required></select>
                </div>
                <div class="two-col">
                    <input type="number" id="prix" placeholder="Prix *" required>
                    <input type="tel" id="telephone" placeholder="Téléphone *" required>
                </div>
                <div class="image-upload" onclick="document.getElementById('imageFiles').click()">
                    <label>📷 Cliquez pour ajouter images</label>
                    <input type="file" id="imageFiles" accept="image/*" multiple onchange="handleImagesUpload(event)">
                </div>
                <div id="imagesPreview" class="images-preview"></div>
                <div class="form-buttons">
                    <button type="submit" class="btn-submit">Publier</button>
                    <button type="button" class="btn-cancel" onclick="closePostModal()">Annuler</button>
                </div>
            </form>
        </div>
    </div>

    <div class="modal" id="detailsModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title" id="detailsTitle"></h2>
                <button class="btn-close" onclick="closeDetailsModal()">✕</button>
            </div>
            <div id="detailsContent"></div>
        </div>
    </div>

    <footer>
        <p>© 2026 Souk Online - Le marché algérien au bout de vos doigts</p>
        <p style="color: #9ca3af; font-size: 0.8rem;">Développé pour les algériens 🇩🇿</p>
    </footer>

    <script>
        const categories = [
            {id:'electronique',name:'📱 Électronique'},{id:'voitures',name:'🚗 Voitures'},{id:'immobilier',name:'🏠 Immobilier'},{id:'vetements',name:'👕 Vêtements'},{id:'meubles',name:'🛋️ Meubles'},{id:'livres',name:'📚 Livres'},{id:'sport',name:'🎮 Loisirs'},{id:'beaute',name:'💄 Beauté'},{id:'cuisine',name:'🍳 Cuisine'},{id:'animaux',name:'🐾 Animaux'},{id:'outils',name:'🔧 Outils'},{id:'emploi',name:'💼 Emploi'}
        ];
        const wilayas = ['Adrar','Chlef','Laghouat','Oum El Bouaghi','Batna','Béjaïa','Biskra','Blida','Bouira','Tamanrasset','Tébessa','Tlemcen','Tiaret','Tizi Ouzou','Alger','Djelfa','Jijel','Sétif','Saïda','Skikda','Sidi Bel Abbès','Annaba','Guelma','Constantine','Médéa','Mostaganem','M\'Sila','Mascara','Oran','El Bayadh','Illizi','Bordj Bou Arréridj','Ouargla','Icheriden','El Oued','Khenchela','Souk Ahras','Tipasa','Mila','Aïn Défla','Naama','Aïn Témouchent','Ghardaïa','Relizane','Draa Ben Khaidah','El Meghaïer','El Ménéa','Ouled Djellal'];
        let annonces = [], selectedImages = [];

        function init() {
            loadAnnonces();
            populateSelects();
            displayAnnonces(annonces);
        }

        function populateSelects() {
            const cat = document.getElementById('categorySelect');
            const cat2 = document.getElementById('categorie');
            const wil = document.getElementById('wilaya');
            cat.innerHTML = '<option value="">Toutes catégories</option>' + categories.map(c => '<option value="' + c.id + '">' + c.name + '</option>').join('');
            cat2.innerHTML = categories.map(c => '<option value="' + c.id + '">' + c.name + '</option>').join('');
            cat2.value = 'electronique';
            wil.innerHTML = wilayas.map(w => '<option value="' + w + '">' + w + '</option>').join('');
            wil.value = 'Alger';
            document.getElementById('wilayaSelect').innerHTML = '<option value="">Toutes wilayas</option>' + wilayas.map(w => '<option value="' + w + '">' + w + '</option>').join('');
        }

        function loadAnnonces() {
            const saved = localStorage.getItem('soukOnlineAnnonces');
            annonces = saved ? JSON.parse(saved) : [];
        }

        function saveAnnonces() {
            localStorage.setItem('soukOnlineAnnonces', JSON.stringify(annonces));
        }

        function postAnnonce(e) {
            e.preventDefault();
            const newAnnonce = {
                id: Date.now(),
                titre: document.getElementById('titre').value,
                categorie: document.getElementById('categorie').value,
                description: document.getElementById('description').value,
                prix: parseInt(document.getElementById('prix').value),
                wilaya: document.getElementById('wilaya').value,
                telephone: document.getElementById('telephone').value,
                images: selectedImages,
                date: new Date().toLocaleDateString('fr-FR'),
                vendu: false
            };
            annonces.unshift(newAnnonce);
            saveAnnonces();
            document.getElementById('postForm').reset();
            selectedImages = [];
            document.getElementById('imagesPreview').innerHTML = '';
            closePostModal();
            displayAnnonces(annonces);
        }

        function handleImagesUpload(e) {
            const files = e.target.files;
            selectedImages = [];
            const preview = document.getElementById('imagesPreview');
            preview.innerHTML = '';
            Array.from(files).forEach((file, index) => {
                const reader = new FileReader();
                reader.onload = (event) => {
                    selectedImages.push(event.target.result);
                    const div = document.createElement('div');
                    div.className = 'image-preview-item';
                    div.innerHTML = '<img src="' + event.target.result + '" alt="Image"><button type="button" class="btn-remove-image" onclick="removeImage(' + index + ')">✕</button>';
                    preview.appendChild(div);
                };
                reader.readAsDataURL(file);
            });
        }

        function removeImage(i) {
            selectedImages.splice(i, 1);
            const preview = document.getElementById('imagesPreview');
            preview.innerHTML = '';
            selectedImages.forEach((img, idx) => {
                const div = document.createElement('div');
                div.className = 'image-preview-item';
                div.innerHTML = '<img src="' + img + '" alt="Image"><button type="button" class="btn-remove-image" onclick="removeImage(' + idx + ')">✕</button>';
                preview.appendChild(div);
            });
        }

        function filterAnnonces() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const cat = document.getElementById('categorySelect').value;
            const wil = document.getElementById('wilayaSelect').value;
            const min = parseInt(document.getElementById('minPrice').value) || 0;
            const max = parseInt(document.getElementById('maxPrice').value) || Infinity;
            const filtered = annonces.filter(a => {
                const match = (a.titre.toLowerCase().includes(search) || a.description.toLowerCase().includes(search));
                return match && (!cat || a.categorie === cat) && (!wil || a.wilaya === wil) && (a.prix >= min && a.prix <= max);
            });
            displayAnnonces(filtered);
        }

        function displayAnnonces(list) {
            const main = document.getElementById('mainContent');
            document.getElementById('countAnnonces').textContent = list.length;
            if (list.length === 0) {
                main.innerHTML = '<div class="empty-state"><div style="font-size: 3rem; margin-bottom: 1rem;">🔍</div><h2 style="font-size: 1.25rem; margin-bottom: 0.5rem;">Aucune annonce</h2><button class="btn-submit" onclick="openPostModal()">Poster</button></div>';
                return;
            }
            main.innerHTML = '<div class="annonces-grid">' + list.map(a => '<div class="annonce-card ' + (a.vendu ? 'vendu' : '') + '" onclick="showDetails(' + a.id + ')"><div class="annonce-image-container">' + (a.vendu ? '<div class="badge-vendu">✓ VENDU</div>' : '') + (a.images && a.images.length ? '<img src="' + a.images[0] + '" alt="Image">' + (a.images.length > 1 ? '<div class="image-counter">' + a.images.length + ' images</div>' : '') : '📦') + '</div><div class="annonce-content"><h3 class="annonce-title">' + a.titre + '</h3><p class="annonce-desc">' + a.description.substring(0, 50) + '...</p><div class="annonce-footer"><div><div class="annonce-price">' + a.prix + ' DA</div><div class="annonce-wilaya">📍 ' + a.wilaya + '</div></div></div></div></div>').join('') + '</div>';
        }

        function showDetails(id) {
            const a = annonces.find(x => x.id === id);
            if (!a) return;
            let imgs = '';
            if (a.images && a.images.length) {
                imgs = '<div style="margin-bottom: 1rem;"><div style="color: #6b7280; font-size: 0.75rem; margin-bottom: 0.3rem;">Images (' + a.images.length + ')</div><div class="images-preview">' + a.images.map((img, i) => '<div class="image-preview-item"><img src="' + img + '" alt="Image ' + (i+1) + '"></div>').join('') + '</div></div>';
            }
            document.getElementById('detailsTitle').textContent = a.titre;
            document.getElementById('detailsContent').innerHTML = imgs + '<div style="margin-bottom: 1rem;"><div style="color: #6b7280; font-size: 0.75rem;">Prix: <strong style="font-size: 1.5rem; color: #ea580c;">' + a.prix + ' DA</strong></div><div style="color: #6b7280; font-size: 0.75rem; margin-top: 0.5rem;">Wilaya: <strong>' + a.wilaya + '</strong></div><div style="color: #6b7280; font-size: 0.75rem; margin-top: 0.5rem;">Date: <strong>' + a.date + '</strong></div></div><div style="margin-bottom: 1rem;"><div style="color: #6b7280; font-size: 0.75rem; margin-bottom: 0.3rem;">Description</div><p>' + a.description + '</p></div><div class="action-buttons"><button class="btn-green" onclick="togglePhone(' + id + ')"><span id="phoneBtn-' + id + '">👁️ Voir numéro</span></button><button class="btn-blue" onclick="toggleVendu(' + id + ')"><span id="venduBtn-' + id + '">' + (a.vendu ? '↩️ Disponible' : '✓ Vendu') + '</span></button></div><div id="phoneSection-' + id + '" style="display: none; margin-top: 0.75rem;"><div class="phone-display"><p style="margin: 0; color: #6b7280; font-size: 0.8rem;">Numéro: <strong style="font-size: 1.25rem; display: block;">' + a.telephone + '</strong></p></div><button class="btn-blue" onclick="window.location.href = \'tel:' + a.telephone + '\'">📞 Appeler</button></div><button class="btn-delete" onclick="deleteAnnonce(' + id + ')">Supprimer</button>';
            document.getElementById('detailsModal').classList.remove('hidden');
        }

        function togglePhone(id) {
            const section = document.getElementById('phoneSection-' + id);
            const btn = document.getElementById('phoneBtn-' + id);
            if (section.style.display === 'none') {
                section.style.display = 'block';
                btn.textContent = '👁️ Masquer';
            } else {
                section.style.display = 'none';
                btn.textContent = '👁️ Voir numéro';
            }
        }

        function toggleVendu(id) {
            const a = annonces.find(x => x.id === id);
            if (a) {
                a.vendu = !a.vendu;
                saveAnnonces();
                showDetails(id);
                displayAnnonces(annonces);
            }
        }

        function deleteAnnonce(id) {
            if (confirm('Supprimer cette annonce ?')) {
                annonces = annonces.filter(x => x.id !== id);
                saveAnnonces();
                closeDetailsModal();
                displayAnnonces(annonces);
            }
        }

        function openPostModal() {
            document.getElementById('postModal').classList.remove('hidden');
            selectedImages = [];
            document.getElementById('imagesPreview').innerHTML = '';
        }

        function closePostModal() {
            document.getElementById('postModal').classList.add('hidden');
        }

        function closeDetailsModal() {
            document.getElementById('detailsModal').classList.add('hidden');
        }

        init();
    </script>
</body>
</html>
